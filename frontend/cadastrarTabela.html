<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerenciar Tabelas de Preço</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px auto;
      max-width: 900px;
      background: #fafafa;
      color: #333;
    }
    h2, h3 {
      text-align: center;
      color: #2e604b;
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      margin-right: 8px;
    }
    select, input[type="text"], input[type="number"], button {
      margin: 5px 10px 15px 0;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }
    select:focus, input[type="text"]:focus, input[type="number"]:focus {
      border-color: #4CAF50;
      outline: none;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px 15px;
      font-size: 14px;
      text-align: left;
    }
    th {
      background-color: #e8f5e9;
      color: #2e604b;
    }
    .actions button {
      margin-right: 5px;
      padding: 5px 10px;
    }
    input[type=number] {
      width: 100px;
    }
    /* Responsividade simples */
    @media (max-width: 600px) {
      body {
        margin: 10px;
      }
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead tr {
        display: none;
      }
      tr {
        margin-bottom: 15px;
        border-bottom: 2px solid #ddd;
      }
      td {
        padding-left: 50%;
        position: relative;
        text-align: right;
        font-size: 13px;
      }
      td::before {
        content: attr(data-label);
        position: absolute;
        left: 15px;
        width: 45%;
        padding-left: 10px;
        font-weight: bold;
        text-align: left;
      }
    }

    .voltar {
  position: absolute;
  top: 15px;
  left: 15px;
  cursor: pointer;
  color: #2e604b;
  transition: color 0.2s;
}

.voltar:hover {
  color: #47846a;
}

  </style>
</head>
<body>
   <!-- 🔙 Ícone de voltar -->
  <div class="voltar" onclick="window.history.back()" title="Voltar">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
      <path fill="currentColor" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/>
    </svg>
  </div>

  <h2>Cadastro de Produtos por Tabela</h2>

  <label for="tabela">Tabela de preço:</label>
  <select id="tabela" onchange="listarProdutos()">
    <option value="go">GO</option>
    <option value="to">TO</option>
  </select>

  <div>
    <input type="text" id="nome" placeholder="Nome do produto" />
<select id="categoria">
  <option value="">Selecione a categoria</option>
  <option value="Mangueiras">Mangueiras</option>
  <option value="Fios">Fios</option>
  <option value="Conexões">Conexões</option>
  <option value="Tintas">Tintas</option>
</select>
    <input type="number" id="preco" placeholder="Preço unitário" step="0.01" min="0" />
    <button onclick="cadastrarProduto()">Cadastrar</button>
  </div>

  <h3>Produtos da tabela selecionada</h3>
  <table id="tabela-produtos">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Preço (R$)</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Função para listar os produtos da tabela selecionada
    function listarProdutos() {
      const tabela = document.getElementById('tabela').value;

      fetch(`/produtos/${tabela}/todos`)
        .then(res => {
          if (!res.ok) throw new Error('Erro ao buscar produtos');
          return res.json();
        })
        .then(produtos => {
          const tbody = document.querySelector('#tabela-produtos tbody');
          tbody.innerHTML = '';

          produtos.forEach(prod => {
            const tr = document.createElement('tr');

            tr.innerHTML = `
              <td data-label="Nome">${prod.nome}</td>
              <td data-label="Categoria">${prod.categoria}</td>
              <td data-label="Preço (R$)">
                <input type="number" value="${prod.preco_unitario.toFixed(2)}" step="0.01" min="0" onchange="atualizarPreco(${prod.id}, this.value)">
              </td>
              <td data-label="Ações" class="actions">
                <button onclick="excluirProduto(${prod.id})">Excluir</button>
              </td>
            `;

            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          alert(err.message);
        });
    }
    // Função para cadastrar produto
    function cadastrarProduto() {
  const tabela = document.getElementById('tabela').value;
  const nomeInput = document.getElementById('nome');
  const categoriaInput = document.getElementById('categoria');
  const precoInput = document.getElementById('preco');

  const nome = nomeInput.value.trim();
  const categoria = categoriaInput.value.trim();
  const preco = parseFloat(precoInput.value);

  if (!nome || !categoria || isNaN(preco) || preco < 0) {
    alert('Preencha todos os campos corretamente!');
    return;
  }

  const produto = { nome, categoria, preco_unitario: preco };

  fetch(`/cadastrar-produtos/${tabela}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify([produto])
  })
    .then(res => {
      if (!res.ok) throw new Error('Erro ao cadastrar produto');

      // limpa campos
      nomeInput.value = '';
      categoriaInput.value = '';
      precoInput.value = '';

      // atualiza tabela
      listarProdutos();

      // 🔥 DEVOLVE O FOCO (ESSENCIAL)
      setTimeout(() => {
        nomeInput.focus();
      }, 50);
    })
    .catch(err => {
      alert(err.message);
    });
}
    // Função para atualizar preço
    function atualizarPreco(id, novoPreco) {
      const tabela = document.getElementById('tabela').value;
      const preco = parseFloat(novoPreco);

      if (isNaN(preco) || preco < 0) {
        alert('Preço inválido');
        listarProdutos();
        return;
      }

      fetch(`/produtos/${tabela}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ preco_unitario: preco })
      })
        .then(res => {
          if (!res.ok) throw new Error('Erro ao atualizar preço');
        })
        .catch(err => {
          alert(err.message);
          listarProdutos();
          // cadastra produto ao clicar enter
          document.getElementById('preco').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    cadastrarProduto();
  }
});
        });
    } 
  function excluirProduto(id) {
    const tabela = document.getElementById('tabela').value;

    fetch(`/produtos/${tabela}/${id}`, {
      method: 'DELETE'
    })
      .then(res => {
        if (!res.ok) throw new Error('Erro ao excluir produto');
        listarProdutos(); // atualiza a lista após excluir
      })
      .catch(err => {
        alert(err.message);
      });
  }
    // Carrega produtos ao iniciar a página
    listarProdutos();
  </script>
</body>
</html>
